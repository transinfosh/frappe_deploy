---
- name: 部署 AI 运行面
  hosts: runtime_nodes
  gather_facts: true
  vars_files:
    - "{{ inventory_dir }}/vault.yml"
  roles:
    - role: common
    - role: docker
    - role: deployment_backup
      vars:
        deployment_backup_component: runtime
        deployment_backup_database_name: "{{ runtime_database_name }}"
        deployment_backup_database_host: "{{ external_database_host | default('') }}"
        deployment_backup_database_port: >-
          {{ external_database_port | default(5432) }}
        deployment_backup_database_admin_password: >-
          {{ vault_runtime_db_admin_password if external_database_enabled | default(false) | bool else '' }}
        deployment_backup_external: "{{ external_database_enabled | default(false) | bool }}"
        deployment_backup_container: tai-runtime-postgres
        deployment_backup_running_containers:
          - tai-tai-service-service-1
          - tai-tai-service-worker-1
        deployment_backup_release_metadata:
          tai_service_image: "{{ tai_service_image }}"
          tai_service_source_commit: "{{ tai_service_source_commit | default('') }}"
    - role: source_snapshot
      when: image_delivery_mode == 'local_bundle'
    - role: runtime_postgres
      when: not (external_database_enabled | default(false) | bool)
    - role: tai_service_config
    - role: python_container
      vars:
        python_container_name: tai-service
        python_container_data_owner: "999"
        python_container_data_group: "999"
        python_container_source: "{{ source_root }}/services/tai-service"
        python_container_image: "{{ tai_service_image if image_delivery_mode == 'registry' else '' }}"
        python_container_extras:
          - runtime
          - observability
        python_container_command: >-
          python -m uvicorn tai_service.server:app
          --host 0.0.0.0 --port {{ tai_service_port }} --workers {{ tai_service_workers }}
        python_container_worker_command: >-
          /app/.venv/bin/python -m tai_service.durable_runner
        python_container_port: "{{ tai_service_port }}"
        python_container_networks:
          - tai-runtime
        python_container_extra_hosts:
          - "{{ control_site_name }}:{{ hostvars[groups['control_nodes'][0]].ansible_host }}"
        python_container_environment:
          TAI_SERVICE_CONFIG: /etc/tai-service/config.json
          TAI_SERVICE_RUNTIME_LOG: /data/tai-service/tai-service-runtime.log
          TAI_RUNTIME_DATABASE_URL: "postgresql://{{ runtime_database_user }}:{{ vault_runtime_db_app_password | urlencode }}@{{ external_database_host if (external_database_enabled | default(false) | bool) else 'tai-runtime-postgres' }}:{{ external_database_port if (external_database_enabled | default(false) | bool) else 5432 }}/{{ runtime_database_name }}"
          WREN_ENGINE_VERSION: "0.13.2"
          TAI_BUILD_GIT_SHA: "{{ tai_service_source_commit }}"
          NO_PROXY: "{{ deployment_no_proxy | replace('\n', '') | replace(' ', '') }}"
          no_proxy: "{{ deployment_no_proxy | replace('\n', '') | replace(' ', '') }}"
        python_container_worker_environment:
          TAI_SERVICE_CONFIG: /etc/tai-service/config.json
          TAI_SERVICE_RUNTIME_LOG: /data/tai-service/tai-service-runtime.log
          TAI_RUNTIME_WORKER_DATABASE_URL: "postgresql://tai_runtime_worker:{{ vault_runtime_db_worker_password | urlencode }}@{{ external_database_host if (external_database_enabled | default(false) | bool) else 'tai-runtime-postgres' }}:{{ external_database_port if (external_database_enabled | default(false) | bool) else 5432 }}/{{ runtime_database_name }}"
          WREN_ENGINE_VERSION: "0.13.2"
          TAI_BUILD_GIT_SHA: "{{ tai_service_source_commit }}"
          NO_PROXY: "{{ deployment_no_proxy | replace('\n', '') | replace(' ', '') }}"
          no_proxy: "{{ deployment_no_proxy | replace('\n', '') | replace(' ', '') }}"
        python_container_migrate_command: >-
          /app/.venv/bin/python -c "import os; from pathlib import Path; from tai_service.migrate import migrate; applied = migrate(os.environ['TAI_RUNTIME_MIGRATION_DATABASE_URL'], Path('/app/migrations')); print('Applied Runtime DB migrations:', ', '.join(map(str, applied)) or 'none')"
        python_container_migrate_environment: "{{ python_container_pre_migrate_environment }}"
        python_container_pre_migrate_command: >-
          /app/.venv/bin/python -m tai_service.durable_cutover --expire-overdue
        python_container_pre_migrate_environment:
          TAI_RUNTIME_MIGRATION_DATABASE_URL: "postgresql://postgres:{{ vault_runtime_db_admin_password | urlencode }}@{{ external_database_host if (external_database_enabled | default(false) | bool) else 'tai-runtime-postgres' }}:{{ external_database_port if (external_database_enabled | default(false) | bool) else 5432 }}/{{ runtime_database_name }}"
        python_container_secrets:
          tai_service_token: "{{ vault_tai_service_token }}"
          tai_control_usage: "{{ vault_tai_control_usage_secret }}"
          tai_control_service_secret: "{{ vault_tai_control_service_secret }}"
          tai_runtime_store_secret: "{{ vault_tai_runtime_store_secret }}"
        python_container_mounts:
          - /etc/tai-service/config.json:/etc/tai-service/config.json:ro
        python_container_data_dirs:
          - /data/tai-service
    - role: tai_service_runtime_bootstrap
    - role: ingress
      vars:
        ingress_hostname: "{{ runtime_public_hostname }}"
        ingress_local_url: "http://127.0.0.1:{{ tai_service_port }}"
